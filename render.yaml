# ─────────────────────────────────────────────────────────────
# QueryCore — Render Cloud Blueprint
# Automatically provisions Database, FastAPI Backend, and Vite Frontend
# ─────────────────────────────────────────────────────────────

databases:
  - name: querycore-db
    databaseName: querycore
    user: querycore_user
    plan: free
    region: oregon

services:
  # ── 1. Backend Web Service (FastAPI) ──
  - type: web
    name: querycore-api
    runtime: python
    plan: free
    region: oregon
    rootDir: server
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: querycore-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: APP_ENV
        value: production
      - key: CORS_ORIGINS
        value: "https://querycore-client.onrender.com,http://localhost:3000,http://localhost:5173"
      - key: PYTHON_VERSION
        value: "3.11.9"

  # ── 2. Frontend Web App (React + Vite SPA) ──
  - type: static
    name: querycore-client
    plan: free
    region: oregon
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: querycore-api
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
