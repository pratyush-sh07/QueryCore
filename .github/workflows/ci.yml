name: QueryCore Continuous Integration

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

jobs:
  # ----------------------------------------------------
  # Frontend Pipeline: Lint, Test & Production Build
  # ----------------------------------------------------
  frontend-ci:
    name: Frontend CI (Client)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./client

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run Frontend Linter (Oxlint)
        run: npm run lint

      - name: Compile Frontend Production Build
        run: npm run build

  # ----------------------------------------------------
  # Backend Pipeline: Unit Tests & Auth Guardrail Verification
  # ----------------------------------------------------
  backend-ci:
    name: Backend CI (Server & Auth Guardrails)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./server

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: server/requirements.txt

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Test Suite with Pytest
        env:
          DATABASE_URL: sqlite:///:memory:
          SECRET_KEY: ci-test-secret-key-32-chars-long-abc
        run: |
          pytest --tb=short

  # ----------------------------------------------------
  # Container Pipeline: Dockerfiles & Compose Validation
  # ----------------------------------------------------
  docker-validation:
    name: Container Configuration Validation
    runs-on: ubuntu-latest
    needs: [frontend-ci, backend-ci]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: docker compose config

      - name: Build Server Container Image
        run: docker build -t querycore-server:test ./server

      - name: Build Client Container Image
        run: docker build -t querycore-client:test ./client
